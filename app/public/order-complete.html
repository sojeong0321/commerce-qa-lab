<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>주문 완료 | commerce-qa-lab</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">commerce-qa-lab</a>
    <nav aria-label="주요 메뉴">
      <a href="/">상품</a>
      <a href="/cart.html" aria-label="장바구니">장바구니 <span id="cart-count" aria-hidden="true" class="count" data-testid="cart-count">–</span></a>
      <a href="/orders.html">주문 내역</a>

    <label class="user-picker">사용자 <select id="user-select"></select></label>

  <main>
    <h1>주문 완료</h1>
    <p id="status-message" class="message message-ok" role="status" hidden></p>

    <section id="order-complete" class="complete-card" aria-label="주문 정보"></section>
  </main>

  <script type="module" src="/js/order-complete.js"></script>

</html>
