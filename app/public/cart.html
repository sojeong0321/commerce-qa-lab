<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>장바구니 | commerce-qa-lab</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">commerce-qa-lab</a>
    <nav aria-label="주요 메뉴">
      <a href="/">상품</a>
      <a href="/cart.html" aria-current="page" aria-label="장바구니">장바구니 <span id="cart-count" aria-hidden="true" class="count" data-testid="cart-count">–</span></a>
      <a href="/orders.html">주문 내역</a>
    </nav>
    <label class="user-picker">사용자 <select id="user-select"></select></label>
  </header>

  <main>
    <h1>장바구니</h1>
    <p id="status-message" class="message message-ok" role="status" hidden></p>
    <p id="error-message" class="message message-error" role="alert" hidden></p>

    <section id="cart-content" aria-label="장바구니 상품"></section>

    <section id="coupon-section" class="coupon-section" aria-labelledby="coupon-heading" hidden>
      <h2 id="coupon-heading">쿠폰</h2>
      <form id="coupon-form" class="coupon-form" novalidate>
        <label for="coupon-code">쿠폰 코드</label>
        <input id="coupon-code" name="couponCode" type="text" autocomplete="off" placeholder="예: WELCOME5000">
        <button type="submit">적용</button>
        <button type="button" id="coupon-clear" class="secondary-button">쿠폰 해제</button>
      </form>
      <ul id="coupon-list" class="coupon-list" aria-label="보유 쿠폰"></ul>
    </section>
  </main>

  <script type="module" src="/js/cart.js"></script>
</body>
</html>
